name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Clean Build
    runs-on: ubuntu-latest

    steps:
      # Checkout del código
      - name: Checkout code
        uses: actions/checkout@v3

      # Configurar Java y Maven
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: "temurin"

      # Construir los proyectos
      - name: Build client-microservice
        run: |
          cd client-microservice
          chmod +x mvnw
          ./mvnw clean package

      - name: Build transactional-microservice
        run: |
          cd transactional-microservice
          chmod +x mvnw
          ./mvnw clean package

  deploy:
    name: Deploy with Docker Compose
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Checkout del código
      - name: Checkout code
        uses: actions/checkout@v3

      # Levantar los servicios con Docker Compose
      - name: Start services
        run: |
          docker-compose up --build -d