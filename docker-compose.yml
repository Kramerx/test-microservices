version: '3.8'
services:
  # Elasticsearch
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    networks:
      - elk
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  # Logstash
  logstash:
    image: docker.elastic.co/logstash/logstash:8.10.2
    container_name: logstash
    volumes:
      - ./logstash.conf:/usr/share/logstash/pipeline/logstash.conf
    ports:
      - "5044:5044"
    depends_on:
      - elasticsearch
    networks:
      - elk

  # Kibana
  kibana:
    image: docker.elastic.co/kibana/kibana:8.10.2
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - elk

  # Client and Transactional Microservices
  client-microservice:
    build: ./client-microservice
    ports:
      - "8080:8080"
    environment:
      DATABASE_HOST: mysql-client
    depends_on:
      - mysql-client
    networks:
      - elk
      - microservice-network

  transactional-microservice:
    build: ./transactional-microservice
    ports:
      - "8081:8081"
    environment:
      DATABASE_HOST: mysql-transactional
      CLIENT_HOST: client-microservice
    depends_on:
      - mysql-transactional
    networks:
      - elk
      - microservice-network

  mysql-client:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: BDD_TRANSACTIONAL
    ports:
      - "3307:3306"
    volumes:
      - mysql-client-data:/var/lib/mysql
    networks:
      - microservice-network

  mysql-transactional:
    image: mysql:latest
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: BDD_TRANSACTIONAL
    ports:
      - "3308:3306"
    volumes:
      - mysql-transactional-data:/var/lib/mysql
    networks:
      - microservice-network

volumes:
  elasticsearch-data:
  mysql-client-data:
  mysql-transactional-data:

networks:
  elk:
    driver: bridge
  microservice-network:
    driver: bridge
  
